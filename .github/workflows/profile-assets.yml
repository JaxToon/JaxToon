# Save as .github/workflows/profile-assets.yml in the JaxToon/JaxToon repo.
# Builds the snake animation and the stats/language cards, then publishes
# them to the `output` branch that README.md points to.
name: Profile assets

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 00:17 UTC (07:17 WIB)
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#134E5E
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#71B280

      - name: Stats and language cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/profile_cards.py "${{ github.repository_owner }}" dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
